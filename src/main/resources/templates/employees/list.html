<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::section})">
<section>
    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between">
        <h2>Lista pracowników</h2>
        <div>
            <a class="btn" th:href="@{/employees/add}">Nowy pracownik</a>
            <a class="btn secondary" th:href="@{/employees/search}">Szukaj</a>
        </div>
    </div>

    <div class="flash-messages">
        <div th:if="${message}" class="flash success" th:text="${message}"></div>
        <div th:if="${error}" class="flash error" th:text="${error}"></div>
    </div>

    <table class="styled-table">
        <thead>
        <tr>
            <th>Imię</th>
            <th>Nazwisko</th>
            <th>Email</th>
            <th>Firma</th>
            <th>Stanowisko</th>
            <th>Wynagrodzenie</th>
            <th>Akcje</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.fullName}">Jan Kowalski</td>
            <td th:text="${employee.email}">jan.kowalski@techcorp.pl</td>
            <td th:text="${employee.companyName}">TechCorp</td>
            <td th:text="${employee.position}">Developer</td>
            <td th:text="${#numbers.formatDecimal(employee.salary, 1, 'COMMA', 2, 'POINT')}">6000.00</td>
            <td>
                <a th:href="@{/employees/edit/{email}(email=${employee.email})}">Edytuj</a>
                &nbsp;|&nbsp;
                <a th:href="@{/employees/delete/{email}(email=${employee.email})}" onclick="return confirm('Na pewno usunąć pracownika?');">Usuń</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="7" class="muted">Brak pracowników do wyświetlenia</td>
        </tr>
        </tbody>
    </table>
</section>
</html>
