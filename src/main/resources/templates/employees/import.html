<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::section})">
<section>
    <h2>Import pracowników</h2>

    <div class="flash-messages">
        <div th:if="${message}" class="flash success" th:text="${message}"></div>
        <div th:if="${importErrors}" class="flash error">
            <ul>
                <li th:each="err : ${importErrors}" th:text="${err}"></li>
            </ul>
        </div>
    </div>

    <form th:action="@{${action}}" method="post" enctype="multipart/form-data">
        <div class="form-row">
            <label>Plik CSV lub XML</label>
            <input type="file" name="file" required />
        </div>
        <div class="form-row">
            <label>Typ pliku</label>
            <select name="fileType">
                <option value="csv">CSV</option>
                <option value="xml">XML</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn">Importuj</button>
            <a class="btn secondary" th:href="@{/employees}">Anuluj</a>
        </div>
    </form>
</section>
</html>
