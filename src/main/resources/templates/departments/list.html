<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: layout(~{::section})">
<section>
    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between">
        <h2>Departamenty</h2>
        <div>
            <a class="btn" th:href="@{/departments/add}">Nowy departament</a>
        </div>
    </div>

    <div class="flash-messages">
        <div th:if="${message}" class="flash success" th:text="${message}"></div>
        <div th:if="${error}" class="flash error" th:text="${error}"></div>
    </div>

    <table class="styled-table">
        <thead>
        <tr>
            <th>Nazwa</th>
            <th>Lokalizacja</th>
            <th>Budżet</th>
            <th>Manager</th>
            <th>Akcje</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="dep : ${departments}">
            <td th:text="${dep.name}">Sales</td>
            <td th:text="${dep.location}">Warszawa</td>
            <td th:text="${#numbers.formatDecimal(dep.budget, 1, 'COMMA', 2, 'POINT')}">100000.00</td>
                <td th:text="${dep.managerEmail == null ? '-' : dep.managerEmail}"></td>
            <td>
                <a th:href="@{/departments/details/{id}(id=${dep.id})}">Szczegóły</a>
                &nbsp;|&nbsp;
                <a th:href="@{/departments/edit/{id}(id=${dep.id})}">Edytuj</a>
                &nbsp;|&nbsp;
                <a th:href="@{/departments/delete/{id}(id=${dep.id})}" onclick="return confirm('Na pewno usunąć departament?');">Usuń</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(departments)}">
            <td colspan="5" class="muted">Brak departamentów do wyświetlenia</td>
        </tr>
        </tbody>
    </table>
</section>
</html>
